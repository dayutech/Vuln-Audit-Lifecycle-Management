# 测试环境配置
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false
  
  h2:
    console:
      enabled: true
  
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
  
  sql:
    init:
      mode: never
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  
  main:
    allow-circular-references: true

# JWT配置
jwt:
  secret: test-secret-key-for-unit-testing-must-be-at-least-256-bits-long
  expiration: 3600000
  refresh-expiration: 86400000

# 通知通道：测试环境默认全部关闭，验证“未配置时降级为仅站内”的基线行为
app:
  # RBAC 启动初始化在测试环境关闭：BaseTest 每个用例都会清库重建角色，
  # 自动种子只会污染用例数据；RBAC 相关用例改为显式调用 PermissionBootstrapService。
  rbac:
    bootstrap-enabled: false
  notify:
    mail:
      enabled: false
    webhook:
      enabled: false
  # 环境部署：测试环境强制关闭容器编排，环境部署一律走 Noop 路径（断言返回失败）
  env:
    docker:
      enabled: false
      command: definitely-not-a-real-docker-cli
      availability-cache-ms: 0

# 日志配置
logging:
  level:
    com.vulnaudit: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
