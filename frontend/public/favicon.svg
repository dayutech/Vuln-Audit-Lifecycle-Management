<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="猫头鹰漏洞审计生命周期管理系统">
  <title>猫头鹰漏洞审计生命周期管理系统</title>
  <!-- 深墨底牌 + 米白猫头鹰 + 琥珀虹膜：16px 下靠轮廓与眼睛辨识 -->
  <rect width="64" height="64" rx="14" fill="#1f2328"/>
  <g transform="translate(4.5 4.5) scale(0.86)">
    <!-- 耳羽 -->
    <path d="M13 22 16.5 7 27 14.5Z" fill="#fdf6e8"/>
    <path d="M51 22 47.5 7 37 14.5Z" fill="#fdf6e8"/>
    <!-- 头 -->
    <circle cx="32" cy="34" r="22" fill="#fdf6e8"/>
    <!-- 虹膜 + 瞳孔（眼睛是焦点） -->
    <circle cx="24.6" cy="33" r="7" fill="#e8901f"/>
    <circle cx="39.4" cy="33" r="7" fill="#e8901f"/>
    <circle cx="24.6" cy="33" r="4.2" fill="#1f2328"/>
    <circle cx="39.4" cy="33" r="4.2" fill="#1f2328"/>
    <!-- 眉线（内低外高：专注/洞察） -->
    <path d="M14 21.5 26 25.6" stroke="#1f2328" stroke-width="4.2" stroke-linecap="round" fill="none"/>
    <path d="M50 21.5 38 25.6" stroke="#1f2328" stroke-width="4.2" stroke-linecap="round" fill="none"/>
    <!-- 喙 -->
    <path d="M32 38.4 37.2 43.6 32 49 26.8 43.6Z" fill="#e8901f"/>
  </g>
</svg>
