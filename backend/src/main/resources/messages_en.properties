# Backend API messages (English)
# Missing keys fall back to the Chinese bundle (messages.properties), then to ErrorCode#getMessage().

# ---------- Generic ----------
error.bad_request=Bad request
error.forbidden=You do not have permission to access this resource
error.not_found=Resource not found
error.conflict=Resource conflict
error.internal=Internal server error
error.validation=Validation failed
error.status.invalid=Invalid status value
error.method_not_allowed=Request method not allowed

# ---------- Authentication ----------
error.auth.unauthorized=Unauthorized, please sign in first
error.auth.invalid_credentials=Invalid username or password
error.auth.password_error=Incorrect password
error.auth.token_invalid=Invalid or expired token

# ---------- Asset ----------
error.asset.not_found=Asset not found
error.asset.access_denied=You do not have access to this asset

# ---------- Vulnerability ----------
error.vulnerability.not_found=Vulnerability not found
error.vulnerability.version_not_in_asset=The discovered version must belong to the target asset
error.vulnerability.number_conflict=Vulnerability number conflict, please retry

# ---------- Task ----------
error.task.not_found=Task not found

