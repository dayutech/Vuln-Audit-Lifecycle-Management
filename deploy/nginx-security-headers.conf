# 漏洞审计平台 —— 安全响应头（t188）
#
# 部署位置：/etc/nginx/snippets/vuln-audit-security-headers.conf
# 引入方式：在 server{} 以及每个自带 add_header 的 location{} 里各 include 一次。
#   原因：nginx 的 add_header 继承是「全有或全无」——只要该层出现了任意 add_header，
#   就不再继承上层的 add_header，安全头会在这些 location 里静默丢失。
#
# 头说明：
#   X-Content-Type-Options: nosniff   —— 禁止浏览器嗅探 MIME（防把上传内容当 HTML 执行）
#   X-Frame-Options: SAMEORIGIN       —— 防点击劫持（本系统不需要被第三方 iframe 嵌入）
#   Referrer-Policy: no-referrer      —— 外链不携带来源 URL（URL 里可能有资产/漏洞 ID）
#   X-XSS-Protection: 0               —— 显式关闭过时的 XSS 过滤器（现代浏览器已移除；保留旧版行为明确）
#   Content-Security-Policy           —— 暂不下发，见 deploy/README.md「安全加固」的说明与后续计划

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy no-referrer always;
add_header X-XSS-Protection "0" always;