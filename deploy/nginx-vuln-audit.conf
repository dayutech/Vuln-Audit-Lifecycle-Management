# 漏洞挖掘生命周期管理系统 —— nginx 站点配置
# 部署位置：/etc/nginx/sites-available/vuln-audit（软链到 sites-enabled）
# 端口 8089 为对外唯一入口，/api 等前缀反代到本机 8088（Spring Boot）

server {
    listen 8089;
    listen [::]:8089;
    server_name _;

    root /var/www/vuln-audit;
    index index.html;

    # 资产镜像 / 安装包 / 交付物上传，SRS 要求单文件 < 100MB
    client_max_body_size 200m;
    client_body_timeout 300s;

    access_log /var/log/nginx/vuln-audit.access.log;
    error_log  /var/log/nginx/vuln-audit.error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ---- 后端 API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;   # 保留端口，避免后端把同源请求误判为跨域
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        # 大文件上传直接透传，不在 nginx 落盘缓冲
        proxy_request_buffering off;
    }

    # ---- Swagger / OpenAPI / health ----
    location /v3/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $http_host;   # 保留端口，避免后端把同源请求误判为跨域
    }
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $http_host;   # 保留端口，避免后端把同源请求误判为跨域
    }
    location = /swagger-ui.html {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $http_host;   # 保留端口，避免后端把同源请求误判为跨域
    }
    location /actuator/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $http_host;   # 保留端口，避免后端把同源请求误判为跨域
    }

    # ---- 带指纹的静态资源：强缓存 ----
    location ~* \.(js|css|svg|png|jpe?g|gif|webp|ico|woff2?|ttf|map)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- SPA 路由：/assets 是「资产中心」页面，必须交给 index.html ----
    # 构建产物已改到 /static/（见 vite.config.ts assetsDir），此处额外兜底，
    # 防止历史产物目录残留导致 GET /assets 被 301 到 /assets/
    location = /assets {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /assets/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # ---- SPA 路由回退（/assets/{id}、/tasks/{id} 直链刷新不 404）----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
