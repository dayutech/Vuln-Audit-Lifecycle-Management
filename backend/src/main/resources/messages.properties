# 后端 API 消息（默认语言：中文）
# 说明：这里是错误码 / 校验消息的「中文默认包」；英文见 messages_en.properties。
# 未在此出现的消息码，运行时回退到 ErrorCode 枚举内的中文文案（不会抛异常）。

# ---------- 通用 ----------
error.bad_request=参数错误
error.forbidden=无权限访问该资源
error.not_found=资源未找到
error.conflict=资源冲突
error.internal=服务器内部错误
error.validation=参数校验失败
error.status.invalid=无效的状态值
error.method_not_allowed=请求方法不允许

# ---------- 认证（t60 覆盖四类之一） ----------
error.auth.unauthorized=未授权，请先登录
error.auth.invalid_credentials=用户名或密码错误
error.auth.password_error=密码错误
error.auth.token_invalid=Token无效或已过期

# ---------- 资产（t60 覆盖四类之一） ----------
error.asset.not_found=资产不存在
error.asset.access_denied=无权访问该资产

# ---------- 漏洞（t60 覆盖四类之一） ----------
error.vulnerability.not_found=漏洞不存在
error.vulnerability.version_not_in_asset=发现版本必须属于当前资产
error.vulnerability.number_conflict=漏洞编号冲突，请重试

# ---------- 任务（t60 覆盖四类之一） ----------
error.task.not_found=任务不存在

# ---------- 参数校验：认证 DTO ----------
validation.auth.username.required=用户名不能为空
validation.auth.password.required=密码不能为空

# ---------- 参数校验：资产 DTO ----------
validation.asset.name.required=资产名称不能为空
validation.asset.name.too_long=名称长度不能超过200个字符
validation.asset.target_type.required=目标类型不能为空
validation.asset.target_source.required=目标来源不能为空
validation.asset.priority.required=优先级不能为空
validation.asset.status.required=资产状态不能为空
validation.asset.team.required=所属团队不能为空
validation.asset.project.required=创建资产必须指定所属项目
validation.asset_link.project.required=挂靠必须指定项目
validation.asset_link.remark.too_long=挂靠备注长度不能超过500个字符
validation.asset.description.too_long=描述长度不能超过1000个字符

# ---------- 用户偏好（t96 / t100） ----------
# Bean Validation 消息码（GlobalExceptionHandler 用 MessageSource 解析，缺键会原样回显 key）
validation.user.login_theme.required=登录页主题不能为空
validation.user.login_theme.too_long=登录页主题长度不能超过32个字符
# {0}=提交的非法值，{1}=支持的主题列表（由 LoginTheme.supportedCodes() 生成，加主题自动同步）
error.user.login_theme.unsupported=不支持的登录页主题: {0}（支持: {1}）

# ---------- 自助注册与验证码（t102） ----------
validation.verification.channel.required=验证码渠道不能为空
validation.verification.target.required=接收方不能为空
validation.verification.target.too_long=接收方长度不能超过120个字符
validation.verification.purpose.required=验证码用途不能为空
validation.verification.code.required=验证码不能为空
validation.user.username.required=用户名不能为空
validation.user.username.size=用户名长度需为3-50个字符
validation.user.password.required=密码不能为空
validation.user.password.size=密码长度需为6-64个字符
validation.user.phone.required=手机号不能为空
validation.registration.reject_note.required=拒绝原因不能为空
validation.registration.reject_note.too_long=拒绝原因长度不能超过500个字符
error.auth.pending_approval=账号待管理员审批，请耐心等待
error.auth.rejected=注册申请已被拒绝
