# 测试环境配置
#
# t121 测试隔离：每个 Spring 上下文使用**独立的**内存库（库名带 ${random.uuid}）。
# 根因：BaseTest 用 @DirtiesContext(AFTER_EACH_TEST_METHOD) 让每个用例都关闭上下文，
# 而 ddl-auto=create-drop 会在上下文关闭时 DROP 所有表；此前所有上下文共用同一个
# jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1，于是「A 上下文关闭时把表删了」会连带打空
# 仍被 Spring 上下文缓存复用的 B 上下文 → 偶发 Table "USER_ROLES" not found。
# 现在库随上下文隔离：关闭时 drop 只影响自己的库。
# 不再使用 DB_CLOSE_DELAY=-1（那会让每个库常驻到 JVM 退出，数百个上下文会吃光堆），
# 改由 Hikari 的最小空闲连接保活：上下文关闭 → 连接关闭 → 内存库自动回收。
spring:
  datasource:
    url: jdbc:h2:mem:vulnaudit-${random.uuid};DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 4
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false
  
  h2:
    console:
      enabled: true
  
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
  
  sql:
    init:
      mode: never
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  
  main:
    allow-circular-references: true

# JWT配置
jwt:
  secret: test-secret-key-for-unit-testing-must-be-at-least-256-bits-long
  expiration: 3600000
  refresh-expiration: 86400000

# 通知通道：测试环境默认全部关闭，验证“未配置时降级为仅站内”的基线行为
app:
  # RBAC 启动初始化在测试环境关闭：BaseTest 每个用例都会清库重建角色，
  # 自动种子只会污染用例数据；RBAC 相关用例改为显式调用 PermissionBootstrapService。
  rbac:
    bootstrap-enabled: false
  notify:
    mail:
      enabled: false
    webhook:
      enabled: false
  # 环境部署：测试环境强制关闭容器编排，环境部署一律走 Noop 路径（断言返回失败）
  env:
    docker:
      enabled: false
      command: definitely-not-a-real-docker-cli
      availability-cache-ms: 0
  # 自助注册验证码（t102）：测试环境打开 dev-mode，便于用例直接从响应取 devCode；
  # 「dev-mode 关闭时不回传 devCode」的用例用反射临时改该值验证。
  security:
    verification:
      dev-mode: true
      code-length: 6
      code-ttl-seconds: 300
      resend-interval-seconds: 300
      max-per-hour: 5
      max-attempts: 5
      max-per-ip-per-hour: 100

# 日志配置
logging:
  level:
    com.vulnaudit: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
